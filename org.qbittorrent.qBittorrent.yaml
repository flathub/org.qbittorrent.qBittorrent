app-id: org.qbittorrent.qBittorrent
runtime: org.kde.Platform
sdk: org.kde.Sdk
# in order to avoid unexpected incompatibilities, only increase it with major qbt release
# upstream: https://invent.kde.org/packaging/flatpak-kde-runtime -> org.kde.Sdk.json.in -> "branch"
runtime-version: '6.11'
command: qbittorrent
rename-icon: qbittorrent
finish-args:
  - --device=dri
  - --filesystem=host  # https://github.com/flathub/org.qbittorrent.qBittorrent#revise-filesystem-permission
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.ayatana.indicator.application  # for Ubuntu MATE and Trisquel
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share/cmake
  - /share/man

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install --with-headers cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz
        sha256: c4a3b310ddd2472416e091067166b0713be97c63f38c212c484ada022fd296ce
        x-checker-data:
          type: html
          url: https://www.boost.org/feed/downloads.rss
          version-pattern: <item><title>Version ([\d\.]+)<\/title>
          url-template: https://archives.boost.io/release/${version}/source/boost_${major}_${minor}_${patch}.tar.gz

  - name: libtorrent
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_CXX_STANDARD=20
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -Ddeprecated-functions=OFF
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.1.2/libtorrent-rasterbar-2.1.2.tar.gz
        sha256: 3362546d9cd71b9e49ee6cac7d3f1f914ce9cdb217c86b63d5b22cbed0334dbc
        x-checker-data:
          type: json
          url: https://api.github.com/repos/arvidn/libtorrent/releases
          version-query: map(.tag_name | select(test("^v2\\.1(?:\\.\\d+)+$"))) | first |
            sub("^v"; "")
          url-query: '"https://github.com/arvidn/libtorrent/releases/download/v" +
            $version + "/libtorrent-rasterbar-" + $version + ".tar.gz"'

  - name: qbittorrent
    buildsystem: cmake-ninja
    builddir: true
    # https://github.com/bitcoin-core/gui/issues/867
    # workaround: when LTO is enabled and linking with Qt, it only allows `PIC`, but GCC was built with
    # `--enable-default-pie`, which uses `PIE` by default. Therefore, we need to explicitly set `-fPIC` to
    # ensure the correct mode.
    build-options:
      cflags: '-fPIC'
      cxxflags: '-fPIC'
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    sources:
      - type: archive
        url: https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.3.0.tar.gz
        sha256: dcb5273496117ebf264fc1fc7936de8707374f07dcee0805228ac5adb403a465
        x-checker-data:
          type: json
          url: https://api.github.com/repos/qbittorrent/qBittorrent/tags
          version-query: map(.name | select(test("^release-\\d+(?:\\.\\d+)+$"))) | first
            | sub("^release-"; "")
          url-query: '"https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-"
            + $version + ".tar.gz"'

  - name: testing
    buildsystem: simple
    build-commands:
      - QT_QPA_PLATFORM=offscreen qbittorrent -v
